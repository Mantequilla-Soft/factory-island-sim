name: Butter Factory collector

on:
  schedule:
    - cron: "15 1 * * 1" # every Monday 01:15 UTC, collects the week that just ended
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub org or user (defaults to repo variable BUTTER_ORG, then the repo owner)"
        required: false
      week:
        description: "ISO week like 2026-W40 (defaults to last complete week)"
        required: false

permissions:
  contents: write

concurrency:
  group: butter-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out collector code
        uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
        continue-on-error: true

      - name: Create data branch if missing
        run: |
          if [ ! -d data-branch/.git ]; then
            mkdir -p data-branch && cd data-branch
            git init -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run collector
        env:
          # Read-only fine-grained PAT with access to the org's repos (falls back to the workflow token: this repo only).
          GITHUB_TOKEN: ${{ secrets.COLLECTOR_TOKEN || github.token }}
          BUTTER_ORG: ${{ inputs.org || vars.BUTTER_ORG || github.repository_owner }}
          BUTTER_PRIVATE_REPOS: ${{ vars.BUTTER_PRIVATE_REPOS || 'anonymize' }}
        run: |
          npx --yes tsx scripts/collector.ts \
            --org "$BUTTER_ORG" \
            ${{ inputs.week && format('--week {0}', inputs.week) || '' }} \
            --out data-branch/snapshots

      - name: Commit snapshots
        working-directory: data-branch
        run: |
          git config user.name "butter-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "snapshots: $(date -u +%Y-%m-%d)"
            git push origin HEAD:data
          fi
